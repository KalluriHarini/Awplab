<html>
<head>
<title>Student Management System</title>
</head>
<body>
Enter Student Name: <input type="text" name="name" id="name">
<br><br>
Enter Student Roll Number: <input type="text" name="roll" id="roll">
<br><br>
Enter Student Branch: <input type="text" name="branch" id="br">
<br><br>
Enter Student Year: <input type="text" name="year" id="yr">
<br><br>
Enter Student CGPA:<input type="text" name="cgpa" id="cg">
<br><br>
<input type="button" name="insert" value="INSERT" id="b1">
<input type="button" name="delete" value="DELETE" id="b2">
<input type="button" name="update" value="UPDATE" id="b3">
<input type="button" name="display" value="DISPLAY" id="b4">
<h2 id="d"></h2>

 
<script type="module">
  // Import the functions you need from the SDKs you need

  import { initializeApp } from
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getDatabase, ref, set, get,
            update, remove, child
        } from
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCpNhajJLbTobmYBfPxHBPxPSj11gLgi5k",
    authDomain: "awplab1-d1741.firebaseapp.com",
    projectId: "awplab1-d1741",
    storageBucket: "awplab1-d1741.firebasestorage.app",
    messagingSenderId: "875458324899",
    appId: "1:875458324899:web:931151db3f337825f45216"
  };

  // Initialize Firebase

  const app = initializeApp(firebaseConfig);
  const dbref =  getDatabase(); //returns reference to the realtime database created

  document.getElementById("b1").addEventListener("click",insertData);
  document.getElementById("b2").addEventListener("click",deleteData);
  document.getElementById("b3").addEventListener("click",updateData);
  document.getElementById("b4").addEventListener("click",displayData);
  function insertData()
  {
var n = document.getElementById("name").value;	
var r = document.getElementById("roll").value;
var b = document.getElementById("br").value;
var y = document.getElementById("yr").value;
var c = document.getElementById("cg").value;
var ob = {
	name : n,
	branch : b,
	year : y,
	cgpa : c
	}
set(ref(dbref,"Student/"+r),ob); //used to insert data into firebase
alert("Student Data Inserted Successfully");
  }
 function deleteData()
  {
var r = document.getElementById("roll").value;
if(r=="")
alert("Please enter roll number");
else
{
remove(ref(dbref,"Student/"+r));
alert("Student Data deleted successfully");
}
}
  function updateData()
  {
	var n = document.getElementById("name").value;	
	var r = document.getElementById("roll").value;
	var b = document.getElementById("br").value;
	var y = document.getElementById("yr").value;
	var c = document.getElementById("cg").value;
	var ob = {
		name : n,
		branch : b,
		year : y,
		cgpa : c
	}
	update(ref(dbref,"Student/"+r),ob); //used to update data from firebase
	alert("Student Data Updated Successfully");
  }
 function displayData() {
    var r = document.getElementById("roll").value;
    if (r == "") {
        alert("Please enter roll number");
    } else {
        get(child(ref(dbref), "Student/" + r)).then(function (data) {
            if (data.exists()) {
                var ob = data.val();
                document.getElementById("d").innerHTML = 
                    "Roll Number: " + r + "<br>" +
                    "Name: " + ob.name + "<br>" +
                    "Branch: " + ob.branch + "<br>" +
                    "Year: " + ob.year + "<br>" +
                    "CGPA: " + ob.cgpa;
            } else {
                alert("NO DATA AVAILABLE");
            }
        });
    }
}

</script>
</body>
</html>
